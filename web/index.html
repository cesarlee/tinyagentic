<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TinyAgentic.ai</title>
<style>
:root {
  --bg: #1a1b26; --bg2: #24283b; --bg3: #2f3349;
  --fg: #c0caf5; --fg2: #a9b1d6; --dim: #565f89;
  --cyan: #7dcfff; --green: #9ece6a; --red: #f7768e;
  --yellow: #e0af68; --magenta: #bb9af7; --blue: #7aa2f7;
  --orange: #ff9e64;
}
* { margin:0; padding:0; box-sizing:border-box; }
body { background:var(--bg); color:var(--fg); font-family:'JetBrains Mono','Fira Code','Consolas',monospace; font-size:13px; height:100vh; overflow:hidden; }
button { font-family:inherit; font-size:12px; cursor:pointer; border:1px solid var(--dim); background:var(--bg2); color:var(--fg); padding:4px 10px; border-radius:4px; }
button:hover { background:var(--bg3); border-color:var(--cyan); }
button.primary { background:var(--blue); border-color:var(--blue); color:#1a1b26; }
button.danger { background:var(--red); border-color:var(--red); color:#1a1b26; }
input, select, textarea { font-family:inherit; font-size:13px; background:var(--bg); color:var(--fg); border:1px solid var(--dim); border-radius:4px; padding:6px 8px; width:100%; }
input:focus, select:focus, textarea:focus { outline:none; border-color:var(--cyan); }
label { color:var(--fg2); font-size:12px; margin-bottom:2px; display:block; }

/* Layout */
#app { display:flex; flex-direction:column; height:100vh; }
#header { background:var(--bg2); padding:6px 16px; border-bottom:1px solid var(--bg3); display:flex; align-items:center; justify-content:space-between; }
#header h1 { font-size:14px; color:var(--cyan); font-weight:600; }
#main { display:flex; flex:1; overflow:hidden; }
#sidebar { width:220px; min-width:220px; background:var(--bg2); border-right:1px solid var(--bg3); overflow-y:auto; padding:8px 0; }
#content { flex:1; overflow-y:auto; padding:12px; }
#statusbar { background:var(--bg2); border-top:1px solid var(--bg3); padding:4px 16px; font-size:12px; color:var(--dim); }

/* Sidebar */
.sb-header { color:var(--cyan); font-size:11px; font-weight:700; padding:8px 12px 4px; letter-spacing:0.5px; }
.sb-item { padding:3px 12px 3px 20px; cursor:pointer; color:var(--fg2); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.sb-item:hover { background:var(--bg3); color:var(--fg); }
.sb-item.active { background:var(--bg3); color:var(--cyan); border-right:2px solid var(--cyan); }
.sb-add { color:var(--green); }
.sb-dimmed { color:var(--dim); }
.dot { display:inline-block; width:8px; height:8px; border-radius:50%; margin-right:6px; vertical-align:middle; }
.dot.running { background:var(--green); }
.dot.stopped { background:var(--dim); }

/* Panels grid */
#panel-grid { display:grid; grid-template-columns:repeat(2,1fr); gap:10px; }
.panel { background:var(--bg2); border:1px solid var(--bg3); border-radius:6px; overflow:hidden; cursor:pointer; }
.panel:hover { border-color:var(--dim); }
.panel-header { padding:6px 10px; display:flex; justify-content:space-between; align-items:center; border-bottom:1px solid var(--bg3); }
.panel-title { font-weight:600; font-size:12px; }
.panel-badge { font-size:10px; padding:2px 6px; border-radius:3px; }
.badge-working { background:var(--green); color:#1a1b26; }
.badge-thinking { background:var(--blue); color:#1a1b26; }
.badge-waiting { background:var(--red); color:#1a1b26; }
.badge-idle { background:var(--yellow); color:#1a1b26; }
.badge-typed { background:var(--magenta); color:#1a1b26; }
.badge-low_ctx { background:var(--orange); color:#1a1b26; }
.badge-zero_ctx { background:var(--red); color:white; }
.badge-stopped { background:var(--bg3); color:var(--dim); }
.panel-body { padding:8px 10px; height:280px; overflow-y:auto; white-space:pre-wrap; word-break:break-all; font-size:11px; color:var(--fg2); line-height:1.4; }

/* Terminal monitor view */
#terminal-view { display:none; flex-direction:column; height:100%; }
#terminal-view.active { display:flex; }
#terminal-header { padding:6px 12px; background:var(--bg2); border-bottom:1px solid var(--bg3); display:flex; justify-content:space-between; align-items:center; flex-shrink:0; }
#terminal-toolbar { display:flex; gap:6px; padding:6px 12px; background:var(--bg2); border-bottom:1px solid var(--bg3); align-items:center; flex-shrink:0; flex-wrap:wrap; }
#terminal-toolbar .tmux-cmd { font-size:12px; background:var(--bg); border:1px solid var(--bg3); border-radius:4px; padding:4px 10px; color:var(--cyan); font-family:inherit; cursor:pointer; user-select:all; }
#terminal-toolbar .tmux-cmd:hover { border-color:var(--cyan); }
.copied-toast { color:var(--green); font-size:11px; opacity:0; transition:opacity 0.3s; }
.copied-toast.show { opacity:1; }
#terminal-output { flex:1; padding:10px; overflow-y:auto; white-space:pre-wrap; word-break:break-all; font-size:12px; line-height:1.5; color:var(--fg); background:var(--bg); }
#terminal-input-bar { display:flex; gap:6px; padding:6px 12px; background:var(--bg2); border-top:1px solid var(--bg3); align-items:center; flex-shrink:0; }
#term-cmd-input { flex:1; font-size:13px; }
#terminal-actions { display:flex; gap:6px; padding:6px 12px; background:var(--bg2); border-top:1px solid var(--bg3); align-items:center; flex-shrink:0; flex-wrap:wrap; }

/* Interactive mode */
#terminal-view.interactive #terminal-output { border:2px solid var(--green); border-radius:4px; }
#terminal-view.interactive #terminal-input-bar { display:none; }
#terminal-view.interactive #terminal-actions { display:none; }
#interactive-banner { display:none; padding:6px 12px; background:var(--green); color:#1a1b26; font-size:12px; font-weight:600; text-align:center; flex-shrink:0; }
#terminal-view.interactive #interactive-banner { display:block; }
button.interactive-on { background:var(--green) !important; border-color:var(--green) !important; color:#1a1b26 !important; }

/* Modal */
.modal-overlay { position:fixed; inset:0; background:rgba(0,0,0,0.6); display:flex; align-items:center; justify-content:center; z-index:100; }
.modal { background:var(--bg2); border:1px solid var(--dim); border-radius:8px; padding:20px; min-width:400px; max-width:600px; max-height:80vh; overflow-y:auto; }
.modal h2 { font-size:14px; color:var(--cyan); margin-bottom:12px; }
.modal .field { margin-bottom:10px; }
.modal .btn-row { display:flex; gap:8px; margin-top:16px; justify-content:flex-end; }
.modal .hint { font-size:11px; color:var(--dim); margin-top:2px; }
.var-row { display:flex; gap:6px; margin-bottom:4px; align-items:center; }
.var-row input { flex:1; }
.var-row button { min-width:30px; padding:4px; }

/* Daemon section */
.daemon-log { font-size:10px; color:var(--dim); padding:2px 12px 2px 20px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
</style>
</head>
<body>
<div id="app">
  <div id="header">
    <h1>TinyAgentic.ai</h1>
    <span id="header-info" style="color:var(--dim);font-size:12px"></span>
  </div>
  <div id="main">
    <div id="sidebar"></div>
    <div id="content">
      <div id="panel-grid"></div>
      <div id="terminal-view">
        <div id="terminal-header">
          <span id="terminal-title"></span>
          <div style="display:flex;gap:6px;align-items:center;">
            <span id="terminal-health" class="panel-badge badge-stopped"></span>
            <button id="btn-interactive" onclick="toggleInteractive()">Interactive</button>
            <button onclick="exitTerminal()">Back (Esc)</button>
          </div>
        </div>
        <div id="terminal-toolbar">
          <span style="color:var(--dim);font-size:11px;">In your local terminal type:</span>
          <code class="tmux-cmd" id="tmux-attach-cmd" onclick="copyTmuxCmd()" title="Click to copy"></code>
          <span class="copied-toast" id="copied-toast">Copied!</span>
          <span style="flex:1"></span>
          <button onclick="doStartFocused();" id="btn-start" style="display:none">Start</button>
          <button onclick="doStopFocused();" id="btn-stop" style="display:none">Stop</button>
        </div>
        <div id="interactive-banner">INTERACTIVE MODE — All keystrokes are sent to the session. Press Ctrl+Shift+I to exit.</div>
        <div id="terminal-output"></div>
        <div id="terminal-input-bar">
          <span style="color:var(--cyan)">&#10095;</span>
          <input id="term-cmd-input" placeholder="Type command and press Enter..." autocomplete="off" />
          <button class="primary" onclick="sendTermCmd()">Send</button>
        </div>
        <div id="terminal-actions">
          <span style="color:var(--dim);font-size:11px;">Keys:</span>
          <button onclick="sendSpecial('Enter')">Enter</button>
          <button onclick="sendSpecial('C-c')">Ctrl+C</button>
          <button onclick="sendSpecial('Tab')">Tab</button>
          <button onclick="sendSpecial('Escape')">Esc</button>
          <button onclick="sendSpecial('Up')">Up</button>
          <button onclick="sendSpecial('Down')">Down</button>
          <button onclick="sendSpecial('C-l')">Clear</button>
          <span style="flex:1"></span>
          <button onclick="promptSendMacro()">Send Macro</button>
        </div>
      </div>
    </div>
  </div>
  <div id="statusbar">Ready</div>
</div>

<div id="modal-root"></div>

<script>
// ── State ──
const API = '';
let state = { dashboards:{}, sessions:{}, macros:{}, routines:{}, scripts:[], sessionVars:[], activeDashboard:'main' };
let currentDashboard = 'main';
let focusedSession = null;    // session in interactive terminal mode
let terminalWs = {};          // session_id -> WebSocket
let stateWs = null;
let panelContent = {};        // session_id -> last content

// ── API helpers ──
async function api(path, opts={}) {
  const r = await fetch(API+path, { headers:{'Content-Type':'application/json'}, ...opts });
  if (!r.ok) { const e = await r.json().catch(()=>({})); throw new Error(e.detail||r.statusText); }
  return r.json();
}
const GET = p => api(p);
const POST = (p,b) => api(p, {method:'POST', body:JSON.stringify(b)});
const PATCH = (p,b) => api(p, {method:'PATCH', body:JSON.stringify(b)});
const PUT = (p,b) => api(p, {method:'PUT', body:JSON.stringify(b)});
const DEL = p => api(p, {method:'DELETE'});

function status(msg, color='var(--dim)') { document.getElementById('statusbar').innerHTML = `<span style="color:${color}">${msg}</span>`; }

// ── Load all data ──
async function loadAll() {
  try {
    const [sessions, dashboards, macros, routines, scripts, sessionVars, active] = await Promise.all([
      GET('/sessions'), GET('/dashboards'), GET('/macros'), GET('/routines'),
      GET('/scripts'), GET('/session-vars'), GET('/dashboards/active'),
    ]);
    state = { sessions, dashboards, macros, routines, scripts, sessionVars, activeDashboard: active.id };
    currentDashboard = active.id;
    renderSidebar();
    renderPanels();
  } catch(e) { status('Failed to connect to API: '+e.message, 'var(--red)'); }
}

// ── Sidebar ──
function renderSidebar() {
  const sb = document.getElementById('sidebar');
  let h = '';

  // Dashboards
  h += `<div class="sb-header">DASHBOARDS</div>`;
  for (const [did, db] of Object.entries(state.dashboards)) {
    const cls = did === currentDashboard ? 'sb-item active' : 'sb-item';
    h += `<div class="${cls}" onclick="switchDashboard('${did}')">${db.name||did}</div>`;
  }
  h += `<div class="sb-item sb-add" onclick="modalCreateDashboard()">+ Dashboard</div>`;

  // Sessions
  h += `<div class="sb-header">SESSIONS</div>`;
  const dbSessions = state.dashboards[currentDashboard]?.sessions || [];
  for (const sid of dbSessions) {
    const s = state.sessions[sid];
    if (!s) continue;
    const dot = s.running ? '<span class="dot running"></span>' : '<span class="dot stopped"></span>';
    h += `<div class="sb-item" onclick="modalEditSession('${sid}')">${dot}${s.name||sid}</div>`;
  }
  h += `<div class="sb-item sb-add" onclick="modalCreateSession()">+ Session</div>`;
  h += `<div class="sb-item sb-dimmed" onclick="modalSessionVars()">Session Vars</div>`;

  // Scripts
  h += `<div class="sb-header">SCRIPTS</div>`;
  for (const name of state.scripts) {
    h += `<div class="sb-item" onclick="modalEditScript('${name}')">${name}</div>`;
  }
  h += `<div class="sb-item sb-add" onclick="modalCreateScript()">+ Script</div>`;

  // Macros
  h += `<div class="sb-header">MACROS</div>`;
  for (const [mid, m] of Object.entries(state.macros)) {
    h += `<div class="sb-item" onclick="modalEditMacro('${mid}')">${m.name||mid}</div>`;
  }
  h += `<div class="sb-item sb-add" onclick="modalCreateMacro()">+ Macro</div>`;

  // Routines
  h += `<div class="sb-header">ROUTINES</div>`;
  for (const [rid, r] of Object.entries(state.routines)) {
    const cd = r.countdown != null ? `${Math.round(r.countdown)}s` : (r.enabled ? 'pending' : 'off');
    const icon = r.enabled ? '&#x21bb;' : '&#x25a1;';
    h += `<div class="sb-item" onclick="modalEditRoutine('${rid}')">${icon} ${r.name||rid} <span style="color:var(--dim)">[${cd}]</span></div>`;
  }
  h += `<div class="sb-item sb-add" onclick="modalCreateRoutine()">+ Routine</div>`;

  // Daemon
  h += `<div class="sb-header">DAEMON</div>`;
  h += `<div class="sb-item" id="daemon-toggle"></div>`;
  h += `<div id="daemon-log-area"></div>`;
  sb.innerHTML = h;
  updateDaemonUI();
}

async function updateDaemonUI() {
  try {
    const ds = await GET('/daemon/status');
    const el = document.getElementById('daemon-toggle');
    if (el) {
      el.innerHTML = ds.active
        ? `<span style="color:var(--green)">&#x25cf;</span> Routines: running`
        : `<span style="color:var(--dim)">&#x25cb;</span> Routines: stopped`;
      el.onclick = () => toggleDaemon(ds.active);
    }
    const logEl = document.getElementById('daemon-log-area');
    if (logEl) logEl.innerHTML = ds.log.slice(-3).map(l => `<div class="daemon-log">${esc(l)}</div>`).join('');
  } catch(e) {}
}

async function toggleDaemon(isActive) {
  try {
    if (isActive) await POST('/daemon/stop');
    else await POST('/daemon/start');
    status(isActive ? 'Daemon stopped' : 'Daemon started', 'var(--green)');
    updateDaemonUI();
  } catch(e) { status('Error: '+e.message, 'var(--red)'); }
}

// ── Dashboard switching ──
function switchDashboard(did) {
  currentDashboard = did;
  PUT('/dashboards/active', {id:did}).catch(()=>{});
  disconnectAllTerminals();
  renderSidebar();
  renderPanels();
}

// ── Panels ──
function renderPanels() {
  if (focusedSession) return; // in terminal mode
  const grid = document.getElementById('panel-grid');
  const dbSessions = state.dashboards[currentDashboard]?.sessions || [];
  let h = '';
  for (const sid of dbSessions) {
    const s = state.sessions[sid];
    if (!s) continue;
    const badge = s.health || 'stopped';
    const content = panelContent[sid] || (s.running ? 'Loading...' : '(stopped)');
    h += `<div class="panel" onclick="enterTerminal('${sid}')">
      <div class="panel-header">
        <span class="panel-title">${esc(s.name||sid)}</span>
        <span class="panel-badge badge-${badge}">${badge.replace('_',' ').toUpperCase()}</span>
      </div>
      <div class="panel-body" id="pbody-${sid}">${esc(content)}</div>
    </div>`;
  }
  if (!h) h = '<div style="color:var(--dim);padding:40px;text-align:center">No sessions in this dashboard</div>';
  grid.innerHTML = h;
  grid.style.display = 'grid';
  document.getElementById('terminal-view').classList.remove('active');
  connectDashboardTerminals();
}

function connectDashboardTerminals() {
  const dbSessions = state.dashboards[currentDashboard]?.sessions || [];
  // Connect WS for each running session
  for (const sid of dbSessions) {
    const s = state.sessions[sid];
    if (s && s.running && !terminalWs[sid]) connectTerminalWs(sid);
  }
}

function connectTerminalWs(sid) {
  if (terminalWs[sid]) return;
  const proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
  const ws = new WebSocket(`${proto}//${location.host}/ws/terminal/${sid}`);
  ws.onmessage = (e) => {
    const msg = JSON.parse(e.data);
    if (msg.type === 'output') {
      panelContent[sid] = msg.content;
      // Update panel body if visible
      const el = document.getElementById(`pbody-${sid}`);
      if (el) { el.textContent = msg.content; el.scrollTop = el.scrollHeight; }
      // Update terminal view if focused
      if (focusedSession === sid) {
        const out = document.getElementById('terminal-output');
        out.textContent = msg.content;
        out.scrollTop = out.scrollHeight;
        updateTerminalHealth({health: msg.health, running: msg.running});
      }
      // Update health in state
      if (state.sessions[sid]) {
        state.sessions[sid].health = msg.health;
        state.sessions[sid].running = msg.running;
      }
    }
  };
  ws.onclose = () => { delete terminalWs[sid]; };
  terminalWs[sid] = ws;
}

function disconnectAllTerminals() {
  for (const [sid, ws] of Object.entries(terminalWs)) { ws.close(); }
  terminalWs = {};
}

// ── State WebSocket ──
function connectStateWs() {
  const proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
  stateWs = new WebSocket(`${proto}//${location.host}/ws/state`);
  stateWs.onmessage = (e) => {
    const msg = JSON.parse(e.data);
    if (msg.type === 'state') {
      // Update session states
      for (const [sid, st] of Object.entries(msg.sessions||{})) {
        if (state.sessions[sid]) {
          state.sessions[sid].running = st.running;
          state.sessions[sid].health = st.health;
        }
        // Connect terminal WS for newly running sessions
        if (st.running && !terminalWs[sid]) {
          const dbSessions = state.dashboards[currentDashboard]?.sessions || [];
          if (dbSessions.includes(sid) || focusedSession === sid) connectTerminalWs(sid);
        }
      }
      // Update routine countdowns
      for (const [rid, rt] of Object.entries(msg.routines||{})) {
        if (state.routines[rid]) {
          state.routines[rid].countdown = rt.countdown;
          state.routines[rid].enabled = rt.enabled;
        }
      }
      // Update sidebar routine countdowns and health badges without full re-render
      updatePanelBadges();
      updateDaemonUI();
    }
  };
  stateWs.onclose = () => { setTimeout(connectStateWs, 3000); };
}

function updatePanelBadges() {
  const dbSessions = state.dashboards[currentDashboard]?.sessions || [];
  for (const sid of dbSessions) {
    const s = state.sessions[sid];
    if (!s) continue;
    const panel = document.querySelector(`[onclick="enterTerminal('${sid}')"]`);
    if (panel) {
      const badge = panel.querySelector('.panel-badge');
      if (badge) {
        const h = s.health || 'stopped';
        badge.className = `panel-badge badge-${h}`;
        badge.textContent = h.replace('_',' ').toUpperCase();
      }
    }
  }
}

// ── Terminal Monitor View ──
function enterTerminal(sid) {
  focusedSession = sid;
  const s = state.sessions[sid];
  document.getElementById('panel-grid').style.display = 'none';
  document.getElementById('terminal-view').classList.add('active');
  document.getElementById('terminal-title').innerHTML = `<span style="color:var(--cyan)">${esc(s?.name||sid)}</span> <span style="color:var(--dim)">[${sid}]</span>`;
  document.getElementById('terminal-output').textContent = panelContent[sid] || '';

  // Show tmux attach command
  const prefix = 'ta'; // matches config.settings.tmux_prefix
  document.getElementById('tmux-attach-cmd').textContent = `tmux attach -t ${prefix}-${sid}`;

  // Update health badge
  updateTerminalHealth(s);

  // Show/hide start/stop buttons
  document.getElementById('btn-start').style.display = s?.running ? 'none' : '';
  document.getElementById('btn-stop').style.display = s?.running ? '' : 'none';

  // Focus the command input
  document.getElementById('term-cmd-input').value = '';
  document.getElementById('term-cmd-input').focus();

  if (!terminalWs[sid]) connectTerminalWs(sid);
  // Request more lines for terminal view
  if (terminalWs[sid]?.readyState === 1) {
    terminalWs[sid].send(JSON.stringify({type:'resize', lines:120}));
  }
}

function updateTerminalHealth(s) {
  const badge = document.getElementById('terminal-health');
  if (!badge) return;
  const h = s?.health || 'stopped';
  badge.className = `panel-badge badge-${h}`;
  badge.textContent = h.replace('_',' ').toUpperCase();
}

function exitTerminal() {
  if (!focusedSession) return;
  // Turn off interactive mode if on
  if (interactiveMode) toggleInteractive();
  // Reset to 20 lines for panel view
  if (terminalWs[focusedSession]?.readyState === 1) {
    terminalWs[focusedSession].send(JSON.stringify({type:'resize', lines:20}));
  }
  focusedSession = null;
  renderPanels();
}

function copyTmuxCmd() {
  const cmd = document.getElementById('tmux-attach-cmd').textContent;
  navigator.clipboard.writeText(cmd).then(() => {
    const toast = document.getElementById('copied-toast');
    toast.classList.add('show');
    setTimeout(() => toast.classList.remove('show'), 1500);
    status('Copied: ' + cmd, 'var(--green)');
  }).catch(() => {
    // Fallback: select the text
    const el = document.getElementById('tmux-attach-cmd');
    const range = document.createRange();
    range.selectNodeContents(el);
    window.getSelection().removeAllRanges();
    window.getSelection().addRange(range);
    status('Select and copy the command', 'var(--yellow)');
  });
}

// Send typed command
function sendTermCmd() {
  const input = document.getElementById('term-cmd-input');
  const text = input.value;
  if (!text || !focusedSession) return;
  input.value = '';
  POST(`/sessions/${focusedSession}/send-keys`, {keys:text, enter:true})
    .then(() => status(`Sent: ${text}`, 'var(--green)'))
    .catch(e => status('Error: '+e.message, 'var(--red)'));
  input.focus();
}

document.getElementById('term-cmd-input').addEventListener('keydown', (e) => {
  if (e.key === 'Enter') { e.preventDefault(); sendTermCmd(); }
  if (e.key === 'Escape') { e.preventDefault(); exitTerminal(); }
});

async function sendSpecial(key) {
  if (!focusedSession) return;
  try {
    await POST(`/sessions/${focusedSession}/send-special-key`, {key});
    status(`Sent ${key}`, 'var(--green)');
  } catch(err) { status('Error: '+err.message, 'var(--red)'); }
}

async function doStartFocused() {
  if (!focusedSession) return;
  try {
    await POST(`/sessions/${focusedSession}/start`);
    status(`${focusedSession} started`, 'var(--green)');
    await loadAll();
    enterTerminal(focusedSession);
  } catch(e) { status('Error: '+e.message, 'var(--red)'); }
}

async function doStopFocused() {
  if (!focusedSession) return;
  try {
    await POST(`/sessions/${focusedSession}/stop`);
    status(`${focusedSession} stopped`, 'var(--yellow)');

// ── Interactive Mode ──
let interactiveMode = false;

function toggleInteractive() {
  interactiveMode = !interactiveMode;
  const view = document.getElementById('terminal-view');
  const btn = document.getElementById('btn-interactive');
  if (interactiveMode) {
    view.classList.add('interactive');
    btn.classList.add('interactive-on');
    btn.textContent = 'Exit Interactive';
    status('Interactive mode ON — all keystrokes sent to session', 'var(--green)');
  } else {
    view.classList.remove('interactive');
    btn.classList.remove('interactive-on');
    btn.textContent = 'Interactive';
    status('Interactive mode OFF', 'var(--dim)');
  }
}

document.addEventListener('keydown', (e) => {
  if (!interactiveMode || !focusedSession) return;

  // Ctrl+Shift+I toggles off
  if (e.ctrlKey && e.shiftKey && e.key === 'I') {
    e.preventDefault();
    toggleInteractive();
    return;
  }

  // Don't capture if a modal is open
  if (document.querySelector('.modal-overlay')) return;

  // Map the key event
  const key = mapKeyEvent(e);
  if (key) {
    e.preventDefault();
    e.stopPropagation();
    sendInteractiveKey(key);
  }
});

function mapKeyEvent(e) {
  // Ctrl+key combos
  if (e.ctrlKey && !e.shiftKey && !e.altKey && !e.metaKey) {
    const letter = e.key.toLowerCase();
    if (letter.length === 1 && letter >= 'a' && letter <= 'z') {
      return {type: 'special', key: `C-${letter}`};
    }
  }

  // Alt+key combos
  if (e.altKey && !e.ctrlKey && !e.shiftKey && !e.metaKey) {
    const letter = e.key.toLowerCase();
    if (letter.length === 1 && letter >= 'a' && letter <= 'z') {
      return {type: 'special', key: `M-${letter}`};
    }
  }

  // Special keys
  const specialMap = {
    'Enter': 'Enter',
    'Backspace': 'BSpace',
    'Tab': 'Tab',
    'Escape': 'Escape',
    'ArrowUp': 'Up',
    'ArrowDown': 'Down',
    'ArrowLeft': 'Left',
    'ArrowRight': 'Right',
    'Home': 'Home',
    'End': 'End',
    'PageUp': 'PageUp',
    'PageDown': 'PageDown',
    'Delete': 'DC',
    'Insert': 'Insert',
    'F1': 'F1', 'F2': 'F2', 'F3': 'F3', 'F4': 'F4',
    'F5': 'F5', 'F6': 'F6', 'F7': 'F7', 'F8': 'F8',
    'F9': 'F9', 'F10': 'F10', 'F11': 'F11', 'F12': 'F12',
  };

  if (specialMap[e.key]) {
    return {type: 'special', key: specialMap[e.key]};
  }

  // Regular characters (single printable char, no modifier except shift)
  if (e.key.length === 1 && !e.ctrlKey && !e.altKey && !e.metaKey) {
    return {type: 'text', text: e.key};
  }

  // Space
  if (e.key === ' ') {
    return {type: 'text', text: ' '};
  }

  return null; // Unhandled, let browser handle it
}

// Batch text input to reduce API calls
let textBuffer = '';
let textTimer = null;

function sendInteractiveKey(key) {
  if (key.type === 'text') {
    textBuffer += key.text;
    if (textTimer) clearTimeout(textTimer);
    textTimer = setTimeout(flushTextBuffer, 50);
  } else {
    // Flush any pending text first, then send the special key
    flushTextBuffer();
    POST(`/sessions/${focusedSession}/send-special-key`, {key: key.key}).catch(() => {});
  }
}

function flushTextBuffer() {
  if (textTimer) { clearTimeout(textTimer); textTimer = null; }
  if (!textBuffer || !focusedSession) { textBuffer = ''; return; }
  const text = textBuffer;
  textBuffer = '';
  POST(`/sessions/${focusedSession}/send-keys`, {keys: text, enter: false}).catch(() => {});
}

function sessionCheckboxes(selected) {
  // selected is a string: "*" or "sid1,sid2,..."
  const selectedSet = selected === '*' ? new Set(['*']) : new Set(selected.split(',').map(s=>s.trim()).filter(Boolean));
  const allChecked = selectedSet.has('*');
  let h = `<div style="max-height:140px;overflow-y:auto;border:1px solid var(--bg3);border-radius:4px;padding:6px;">`;
  h += `<label style="display:flex;align-items:center;gap:6px;margin-bottom:4px;cursor:pointer"><input type="checkbox" class="sess-cb" value="*" ${allChecked?'checked':''} onchange="toggleAllSessions(this)" style="width:auto"/>* (all sessions)</label>`;
  for (const [id, s] of Object.entries(state.sessions)) {
    const checked = allChecked || selectedSet.has(id) ? 'checked' : '';
    h += `<label style="display:flex;align-items:center;gap:6px;margin-bottom:2px;cursor:pointer"><input type="checkbox" class="sess-cb" value="${id}" ${checked} onchange="uncheckAllIfIndividual(this)" style="width:auto"/>${esc(s.name||id)}</label>`;
  }
  h += `</div>`;
  return h;
}

function toggleAllSessions(el) {
  const cbs = document.querySelectorAll('.sess-cb');
  for (const cb of cbs) { if (cb.value !== '*') cb.checked = el.checked; }
}
function uncheckAllIfIndividual(el) {
  const allCb = document.querySelector('.sess-cb[value="*"]');
  if (allCb) allCb.checked = false;
}
function getSelectedSessions() {
  const allCb = document.querySelector('.sess-cb[value="*"]');
  if (allCb?.checked) return '*';
  const checked = [...document.querySelectorAll('.sess-cb:checked')].map(cb=>cb.value).filter(v=>v!=='*');
  return checked.join(',') || '*';
}

// ── Keyboard shortcuts ──
document.addEventListener('keydown', (e) => {
  // Interactive mode handles its own keys
  if (interactiveMode) return;
  if (e.key === 'Escape' && focusedSession) { exitTerminal(); e.preventDefault(); return; }
  if (e.key === 'Escape' && document.querySelector('.modal-overlay')) { closeModal(); e.preventDefault(); }
});

// ── Init ──
loadAll();
connectStateWs();
</script>
</body>
